<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="#E81C76" stroke-width="12"/>
  
  <!-- Palms in background -->
  <path d="M 50,400 Q 80,240 100,160 Q 80,130 50,140 Q 90,150 100,160 Q 120,130 140,110 Q 110,140 100,160 Q 130,170 150,180 Z" fill="#0A5C36" opacity="0.4"/>
  <path d="M 350,400 Q 320,240 300,160 Q 320,130 350,140 Q 310,150 300,160 Q 280,130 260,110 Q 290,140 300,160 Q 270,170 250,180 Z" fill="#0A5C36" opacity="0.4"/>

  <!-- Character -->
  <g transform="translate(0, 10)">
    <!-- Face -->
    <circle cx="200" cy="180" r="95" fill="#FED7AA" stroke="#1F2937" stroke-width="8"/>
    <!-- Hair -->
    <path d="M 120,180 C 100,100 160,50 200,50 C 250,50 300,100 280,180 C 260,120 230,100 200,100 C 160,100 135,130 120,180 Z" fill="#3E2723"/>
    <!-- Glasses -->
    <rect x="145" y="160" width="45" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.3" stroke="#1F2937" stroke-width="6"/>
    <rect x="210" y="160" width="45" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.3" stroke="#1F2937" stroke-width="6"/>
    <line x1="190" y1="176" x2="210" y2="176" stroke="#1F2937" stroke-width="6"/>
    <!-- Eyes -->
    <circle cx="167" cy="176" r="6" fill="#1F2937"/>
    <circle cx="232" cy="176" r="6" fill="#1F2937"/>
    <!-- Smile with red lips -->
    <path d="M 165,220 Q 200,255 235,220" fill="#E11D48" stroke="#1F2937" stroke-width="6"/>
    <path d="M 172,223 Q 200,242 228,223 Z" fill="#FFFFFF"/>
    <!-- Cheeks blush -->
    <ellipse cx="140" cy="205" rx="14" ry="8" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="260" cy="205" rx="14" ry="8" fill="#FB7185" opacity="0.6"/>
    <!-- Clothes (Warm yellow top) -->
    <path d="M 110,290 C 130,260 170,250 200,250 C 230,250 270,260 290,290 L 340,390 L 60,390 Z" fill="#FACC15" stroke="#1F2937" stroke-width="8"/>
  </g>
</svg>
