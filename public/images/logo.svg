<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Stylized Hot Pink Bubble Logo matching Pobreng Maestra banner -->
  <g filter="url(#shadow)">
    <!-- White outer stroke backdrop -->
    <text x="260" y="80" text-anchor="middle" font-family="'Fredoka', 'Arial Black', sans-serif" font-weight="900" font-size="74" fill="#FFFFFF" stroke="#000000" stroke-width="16" stroke-linejoin="round">Pobreng</text>
    <text x="260" y="155" text-anchor="middle" font-family="'Fredoka', 'Arial Black', sans-serif" font-weight="900" font-size="74" fill="#FFFFFF" stroke="#000000" stroke-width="16" stroke-linejoin="round">Maestra</text>
    
    <!-- Hot Pink Fill -->
    <text x="260" y="80" text-anchor="middle" font-family="'Fredoka', 'Arial Black', sans-serif" font-weight="900" font-size="74" fill="#E81C76">Pobreng</text>
    <text x="260" y="155" text-anchor="middle" font-family="'Fredoka', 'Arial Black', sans-serif" font-weight="900" font-size="74" fill="#E81C76">Maestra</text>
  </g>
</svg>
